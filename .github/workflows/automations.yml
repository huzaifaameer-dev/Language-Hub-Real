name: Automations Cron

on:
  schedule:
    # Every 6 hours (UTC). Adjust the cron to suit your traffic/runtime limits.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  run-automations:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/automations
        env:
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          # Set this repository variable to the real production origin, e.g.
          # https://www.languagehub.example  (Settings → Secrets and variables →
          # Actions → Variables). It is intentionally NOT hardcoded here.
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL:-}" ]; then
            echo "::error::PRODUCTION_URL repository variable is not set."
            echo "Add it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ -z "${AUTOMATION_SECRET:-}" ]; then
            echo "::error::AUTOMATION_SECRET secret is not set."
            exit 1
          fi
          # The secret travels in a header, never in the query string, so it
          # cannot leak into proxy or access logs.
          curl -fsS \
            -H "User-Agent: github-actions-cron" \
            -H "Authorization: Bearer $AUTOMATION_SECRET" \
            "$PRODUCTION_URL/api/automations" \
            || echo "automations run reported a non-2xx status"
