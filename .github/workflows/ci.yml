name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Upload build cache for e2e
        uses: actions/upload-artifact@v4
        with:
          name: next-cache
          path: .next
          if-no-files-found: ignore

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: languagehub
      # TEST-ONLY fixtures — never production credentials. Matches the defaults
      # in e2e/*.spec.ts (they can be overridden via the LH_TEST_ADMIN_* vars).
      ADMIN_EMAIL: ci.e2e.admin@languagehub.test
      ADMIN_PASSWORD: E2e-Test-Admin-Pass-9x!
      ADMIN_ACCESS_CODE: E2E-TEST-ACCESS-9x
      NEXTAUTH_SECRET: ci-only-secret-00000000000000000000000000000000
      AUTH_SECRET: ci-only-secret-00000000000000000000000000000000
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E
        run: npx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
